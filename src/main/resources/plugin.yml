name: InsynPracticeBotMC
provides: [PracticePlugin]
version: '${version}'
main: dev.insanmiy.practiceplugin.PracticePlugin
api-version: '${minecraftVersion}'
author: insanmiy
description: PvP practice against a custom bot.
commands:
  practice:
    description: PvP bot practice
    aliases: [p, prac]
    usage: /practice <menu|settings|start|stop|pause|resume|rematch|hud|damage|stats|kits|difficulties|kit|status|arena|reload>
    permission: practice.use
permissions:
  practice.use:
    default: true
  practice.admin:
    default: op
  practice.kits:
    description: Create unlimited custom kits and edit your own kits
    default: true
