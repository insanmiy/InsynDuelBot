# Reload changes in-game using: /practice reload
#
# Kit Structure:
#   description:           Display description shown in the practice menu
#   health:                Starting and maximum health points (20 = 10 hearts)
#   natural-regeneration:  Whether standard food/saturation healing is enabled
#   armor:                 [BOOTS, LEGGINGS, CHESTPLATE, HELMET]
#   armor-enchantments:    Applied armor enchantments (e.g. {protection: 4, unbreaking: 3, mending: 1})
#   weapon-enchantments:   Applied melee weapon enchantments (e.g. {sharpness: 5, fire_aspect: 2, sweeping_edge: 3, efficiency: 5, unbreaking: 3, mending: 1})
#   bow-enchantments:      Applied bow enchantments (e.g. {power: 5, punch: 2, unbreaking: 3, quick_charge: 3})
#   offhand:               Off hand item (e.g. SHIELD:1, TOTEM_OF_UNDYING:1, or AIR)
#   items:                 Inventory slots 0-35 with format: '<MATERIAL>:<AMOUNT>'
#                          or objects: {type: <MATERIAL>, enchants: {<ENCHANT>: <LEVEL>}}
#                          or potion objects: {type: SPLASH_POTION, potion: <POTION_TYPE>}
