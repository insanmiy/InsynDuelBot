name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        version: ["1.20.5", "1.20.6", "1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
      fail-fast: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: Test Minecraft ${{ matrix.version }}
        run: ./gradlew runServer -PminecraftVersion="${{ matrix.version }}" -PcompatibilityTest=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.version }}
          path: |
            run/compatibility/${{ matrix.version }}/compatibility-result.txt
            run/compatibility/${{ matrix.version }}/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: matrix.version == '1.21.1'
        with:
          name: InsynDuelBot
          path: build/libs/*.jar
