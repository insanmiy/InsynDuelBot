# Tip: Many of these settings can also be customized directly in-game via
#      /practice settings or through the GUI menu!

# Configuration format version. Do not modify.
config-version: 7

# Arena Settings
arena:
  # Block protection radius (in blocks) around the arena center.
  # Outside players cannot place or break blocks within this area.
  radius: 128.0

  # Maximum allowed arena radius limit (in blocks).
  # Set to 0.0 for unlimited arena radius.
  max-radius: 0.0

# Session & Match Defaults
session:
  # Default kit chosen when a player opens the practice menu for the first time.
  default-kit: diamond-smp

  # Default bot combat difficulty tier (can be any difficulty defined under 'difficulties:').
  default-difficulty: lt4

  # Default practice match mode:
  # - endless: Continuous fight where the bot respawns upon defeat
  # - match:   Best-of series with rounds and score tracking
  # - duel:    Single 1v1 round to the death
  # - 2v1:     Best-of series against 2 bots
  # - 3v1:     Best-of series against 3 bots
  default-mode: match

  # Series round count for "match" mode (e.g. 5 = best of 5, first to 3 wins).
  best-of: 3

  # Starting saturation level for both fighters at the start of each round (0.0 - 20.0).
  starting-saturation: 20.0

  # Pre-match countdown delay in seconds before combat begins.
  countdown-seconds: 4

  # Pause delay in seconds between rounds in a series before the next round begins.
  between-round-seconds: 3

  # Seconds before a round with no winner is reset (0 = no timeout).
  round-timeout-seconds: 0

# Name of the practice bot entity shown in game.
bot-name: PracticeBot

# Display the real-time match BossBar showing bot health and round status.
hud: true

# Enable animated pulsing glass panes and glint effects in plugin GUI menus.
menu-animations: true



# Optional Fields (per difficulty tier):
# - display-name: Custom name shown in menus and HUD (e.g. "Rookie" or "§aBeginner")
# - icon:         Item material shown in the GUI (e.g. WOODEN_SWORD, DIAMOND_SWORD, GRASS_BLOCK)
# - description:  Custom lore description shown in the difficulty selection menu
#
# Combat Attributes:
# - decision-ticks:      How often the bot re-evaluates actions (1-40 ticks; 20t = 1s). Lower = faster.
# - perception-ticks:    Simulated human reaction latency / ping (0-40 ticks; 0 = instant 0ms).
# - aim-error:           Crosshair aiming inaccuracy in degrees (0.0 = perfect laser tracking).
# - attack-charge:       Minimum attack cooldown charge required to swing (0.2 - 1.0; 1.0 = full damage).
# - shield-chance:       Chance to block incoming attacks with off-hand shield (0.0 - 1.0).
# - shield-ticks:        How long (in ticks) the bot holds its shield up per block (1-40 ticks).
# - counters:            Whether the bot equips an axe to disable shields when the opponent blocks.
# - sprint-reset-chance: Chance to sprint-reset (W-tap) after each hit to deal combo knockback (0.0 - 1.0).
# - strafe-strength:     Lateral dodging movement speed multiplier (0.0 - 1.0; 1.0 = max strafe).
# - heal-threshold:      Health percentage threshold to drink/splash pots or eat golden apples (0.0 - 1.0).
# - crit-chance:         Chance to attempt a jump critical hit instead of a normal ground hit (0.0 - 1.0).
# - pearl-chance:        Chance to throw an escape Ender Pearl when low on health or after popping a totem (0.0 - 1.0).
# - attacks-enabled:     Whether the bot actively attacks back (set false for peaceful / passive).
