    # Player Settings Messages
    reset-defaults: "%prefix%&aReset bot combat settings to difficulty defaults."
    save-error: "%prefix%&cSettings could not be saved; previous value retained."
    preset-tab: "Bot presets"
    preset-tab-description: "Save and restore bot abilities and advanced tuning"
    preset-load-help: "Left click: load this preset"
    preset-update-help: "Shift left click: replace with current bot settings"
