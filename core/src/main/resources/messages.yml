# All plugin messages and notifications can be customized below.
#
# Formatting Options:
# - Standard Color Codes: &0-&f, &l, &o, &n, &m, &r
# - Hex / RGB Color Codes: &#RRGGBB or <#RRGGBB> (e.g. &#55FF55 or <#FF5555>)
# - Adventure MiniMessage Tags: <red>, <gold>, <click:run_command:'...'>, <hover:show_text:'...'>
# - Context Placeholders: %placeholder% (e.g. %prefix%, %player%, %arena%, %kit%, %difficulty%)
# - PlaceholderAPI (PAPI): Any %placeholder% is parsed if PlaceholderAPI is installed.
# - Custom Placeholders: Define your own placeholders under the 'placeholders:' section below.
# - To disable any message, set its value to "" or "none".
# - Multiline messages are supported as lists:
#     example-message:
#       - "&aLine 1"
#       - "&bLine 2"

# %prefix%
prefix: "&9InsynPracticeBot &r"

# You Can Define Custom Placeholders Here To Use Across All Messages.
placeholders:
    "%server%": "&bMyServer"

general:
    no-permission: "%prefix%&cYou Are Missing The Permission: &e%permission%"
    players-only: "%prefix%&cThis Command Can Only Be Used By Players."
    number-format-error: "%prefix%&cExpected A Number But Got: &e%error%"
    internal-error: "%prefix%&cPractice Could Not Complete That Action. Check The Server Log."
    plugin-reloaded: "%prefix%&aSettings Reloaded."
    reload-busy-warning: "%prefix%&cStop All Matches Before Reloading Settings."
    menu-favorites-save-error: "%prefix%&cCould Not Save Favorites. Check The Server Log."

session:
    # Practice Session Lifecycle Messages
    already-in-match: "%prefix%&cYour Practice Is Already Active. Use /practice Stop First."
    stop-before-menu: "%prefix%&cUse /practice Stop Before Selecting Another Kit."
    respawn-before-practice: "%prefix%&cRespawn Before Practicing."
    recovery-pending: "%prefix%&cAn Interrupted Session Must Finish Recovery First."
    unknown-selection: "%prefix%&cUnknown Kit/Difficulty. Use /practice Kits Or /practice Difficulties."
    paper-criticals-warning: "%prefix%&eWarning: This World's Paper Configuration Disables Player Critical Hits. The Bot Respects That Setting."
    custom-tuning-active: "%prefix%&eNotice: Custom Bot Tuning Is Active From Your Settings (/practice Settings)."
    starting: "%prefix%&aStarting %kit% / %difficulty% / %mode%. Both Receive %summary%. Use /practice Stop To Finish."
    starting-arena: "%prefix%&7Arena: &f%arena%"
    no-active-match: "%prefix%&cNo Active Practice."
    no-active-match-other: "%prefix%&cNo Active Practice For That Player."
    match-stopped: "%prefix%&ePractice Stopped."
    match-stopped-player: "%prefix%&eStopped Practice For %player%."
    session-internal-error: "%prefix%&cPractice Could Not Start. Check The Server Log."
    session-stopped-error: "%prefix%&cSession Stopped After An Internal Error."
    bot-spawn-failed: "%prefix%&cCould Not Start The Bot."
    fighter-disconnected: "%prefix%&cA Fighter Disconnected; Your State Has Been Saved For Recovery."
    player-disconnected: "%prefix%&cPlayer Disconnected."
    safe-ground-waiting: "%prefix%&ePractice Is Still Active. The Bot Is Waiting For Safe Ground Nearby."
    water-journal-failed: "%prefix%&cPlace Water Or Lava Into Air Or A Placed Block; Oversized Flows Are Not Supported In Practice."
    block-journal-failed: "%prefix%&cBlock Placement Cancelled Because Safe Cleanup Could Not Be Recorded."
    no-free-bot-names: "%prefix%&cNo Free Bot Names Available."

combat:
    # Countdown And Round Start / End Notifications
    round-timed-out: "%prefix%&eRound Timed Out; Resetting."
    fight-start: "%prefix%&c&lFight! &7/practice Stop To Finish."
    lethal-hit: "%prefix%&e%target% Took A Lethal Hit."
    bot-eliminated: "%prefix%&eA Bot Was Eliminated! &7(&a%remaining%&7 Remaining)"
    round-won: "%prefix%&aYou Won Round %round%. %summary%"
    round-lost: "%prefix%&cBot Won Round %round%. %summary%"
    duel-finished: "%prefix%&6Duel Finished! %result%"
    match-finished: "%prefix%&6Match Finished! %result%"
    v21-finished: "%prefix%&62v1 Match Finished! %result%"
    v31-finished: "%prefix%&63v1 Match Finished! %result%"
    series-finished: "%prefix%&6Series Finished: %score%."
    player-won-duel: "You Won The Duel!"
    bot-won-duel: "Bot Won The Duel!"
    player-won-match: "You Won The Match %score%!"
    bot-won-match: "Bot Won The Match %score%!"
    player-won-2v1: "You Won The 2v1 Match %score%!"
    bot-won-2v1: "Bots Won The 2v1 Match %score%!"
    player-won-3v1: "You Won The 3v1 Match %score%!"
    bot-won-3v1: "Bots Won The 3v1 Match %score%!"
    session-summary: "%prefix%&7Session: &a%wins%W&7/&c%losses%L &7| %summary%"

    # Pause And Resume Messages
    rematch-none: "%prefix%&cStart A Practice Session First."
    wait-for-round-result: "%prefix%&cWait For The Round Result."
    already-paused: "%prefix%&cAlready Paused."
    not-paused: "%prefix%&cNot Paused."
    actionbar-paused: "&ePractice Paused. /practice Resume"
    actionbar-resumed: "&aPractice Resumed."
    hud-enabled: "%prefix%&7Practice HUD &aEnabled&7."
    hud-hidden: "%prefix%&7Practice HUD &cHidden&7."

arena:
    # Arena Configuration And Feedback
    no-free-arena: "%prefix%&cNo Free, Non-Overlapping Arena. %errors% Admins: /practice Arena Setplayer <name> And Setbot <name>."
    occupied: "%prefix%&cThat Arena Is Occupied."
    cannot-delete-occupied: "%prefix%&cCannot Delete An Occupied Arena."
    unsafe-spawn: "%prefix%&cStand On Solid Ground With Clear Headroom."
    saved-spawn: "%prefix%&aSaved %point% Spawn For Arena '%arena%'."
    saved-radius: "%prefix%&aSaved Radius %radius% For Arena '%arena%'."
    deleted: "%prefix%&aDeleted Arena '%arena%'."
    teleported: "%prefix%&aTeleported To Arena '%arena%'."
    missing-spawns: "%prefix%&cSet Both Spawns: /practice Arena Setplayer And Setbot."
    radius-invalid: "%prefix%&cRadius Must Be At Least 1 Block."
    radius-exceeds-max: "%prefix%&cArena Radius (%radius%) Exceeds Configured Max Radius (%max%)."
    name-invalid: "%prefix%&cArena Names: 1 To 32 Letters, Digits, Hyphen Or Underscore."
    header: "&6--- Practice Arenas ---"
    entry: "&7- &f%arena%&7: %status%"
    status-ready: "&a[Ready (%radius%m)]"
    status-in-use: "&c[In Use]"
    status-incomplete: "&e[Incomplete: %error%]"
    info: "%prefix%&7Player: &f%player% &7| Bot: &f%bot% &7| Radius: &f%radius%"
    ready: "%prefix%&aArena Ready (%radius%m Radius)."

kit:
    # Kit Editor And Management Messages
    editing: "%prefix%&eEditing %name%. Click Save To Keep It. Closing Discards Unsaved Changes."
    saved: "%prefix%&aSaved %name%. Available Immediately In /practice."
    deleted: "%prefix%&cDeleted %name%. Previous File: customkits.yml.bak"
    discarded: "%prefix%&7Draft Discarded."
    naming-prompt: "%prefix%&eType The New Kit Name In Chat (Or Type 'cancel' To Cancel)."
    naming-cancelled: "%prefix%&7Kit Naming Cancelled."
    named: "%prefix%&aKit Named %name%."
    imported-inventory: "%prefix%&aImported %count% Items From Your Inventory. Click Save To Keep These Changes."
    inventory-saved: "%prefix%&aImported Your Inventory Into %name% And Saved Successfully!"
    armor-enchants-copied: "%prefix%&aCopied Compatible Enchantments To Equipped Armor."
    reserve-filled: "%prefix%&aFilled %count% Empty Reserve Slots. Existing Items Kept."
    enchantment-applied: "%prefix%&aApplied %enchant% %level% To %item%."
    quick-enchant-applied: "%prefix%&aApplied %count% Enchantment Upgrades; Incompatible/Conflicting Choices Skipped."
    action-error: "%prefix%&cCould Not Complete The Kit Action. Check The Server Log Before Retrying."
    naming-error: "%prefix%&cAn Unexpected Error Occurred While Naming Kit."
    unknown-kit: "%prefix%&cUnknown Kit."

settings:
    # Player Settings Messages
    reset-defaults: "%prefix%&aReset Bot Combat Settings To Difficulty Defaults."
    save-error: "%prefix%&cSettings Could Not Be Saved; Previous Value Retained."

commands:
    # Command Usage And Status Messages
    usage:
        - "&6&m----------------------------------------"
        - "&9&lInsynPracticeBot Commands"
        - "&e/practice Menu &7- Open Practice Selection Menu"
        - "&e/practice Start [Kit] [Difficulty] [Mode] [BestOf] &7- Start Match"
        - "&e/practice Stop [Player] &7- Stop Current Match"
        - "&e/practice Pause &7/ &e/practice Resume &7- Pause Or Resume Match"
        - "&e/practice Rematch &7- Rematch Previous Opponent"
        - "&e/practice Settings &7- Open Practice Settings GUI"
        - "&e/practice Hud &7- Toggle BossBar HUD Display"
        - "&e/practice Damage &7- Toggle Combat Damage Diagnostics"
        - "&e/practice Stats &7- View Win/Loss Statistics"
        - "&e/practice Kits &7- List Available Kits"
        - "&e/practice Difficulties &7- List Bot Difficulties"
        - "&e/practice Kit <Editor|Create|Import|Edit|Delete> &7- Manage Kits"
        - "&e/practice Arena <List|Setplayer|Setbot|Tp> &7- Manage Arenas"
        - "&e/practice Status &7- View Practice System Status"
        - "&e/practice Reload &7- Reload Plugin Configuration"
        - "&6&m----------------------------------------"
    arena-usage: "%prefix%&e/practice Arena <List|Setplayer|Setbot|Setradius|Info|Delete|Tp> [Name]"
    kit-command-usage: "%prefix%&e/practice Kit <Create|Import|Edit|Save|Delete|Copy|Rename> <Name>"
    kit-info-usage: "%prefix%&e/practice Kit Info <Name>"
    arena-delete-usage: "%prefix%&e/practice Arena Delete <Name>"
    arena-setradius-usage: "%prefix%&e/practice Arena Setradius <Radius> [Name]"
    kit-entry: "&b%kit%&7: &f%summary%"
    difficulty-entry: "&b%difficulty%&7: Reaction &f%decision%t&7, Perception &f%perception%t&7, Aim Error &f%aim% Degrees&7; Vanilla Damage"
    stats-current: "&7Current (Not Saved Yet): &f%summary%"
    status-sessions: "&7Active Sessions: &f%sessions% &7| Arenas: &f%arenas%"
    status-kits: "&7Kits: &f%kits% &7| Default: &f%default_kit% &7/ &f%default_difficulty%"
    status-match: "&f%player% &7• Round &f%round% &7• &a%wins%&7:&c%losses%"
    status-no-match: "&7No Active Match."
