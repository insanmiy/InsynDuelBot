# =============================================================================
#                            PRESET KITS CONFIGURATION
# =============================================================================
# Realistic, authentic competitive PvP kits modeled after popular PvP servers
# (Minemen Club, Stray.gg, PvPGym, and competitive practice networks).
#
# Reload changes in-game using: /practice reload
#
# Kit Structure:
#   description:           Display description shown in the practice menu
#   health:                Starting and maximum health points (20 = 10 hearts)
#   natural-regeneration:  Whether standard food/saturation healing is enabled
#   armor:                 [BOOTS, LEGGINGS, CHESTPLATE, HELMET]
#   armor-enchantments:    Applied armor enchantments (e.g. {protection: 4, unbreaking: 3})
#   weapon-enchantments:   Applied melee weapon enchantments (e.g. {sharpness: 5, unbreaking: 3})
#   bow-enchantments:      Applied bow enchantments (e.g. {power: 5, punch: 2})
#   offhand:               Off-hand item (e.g. SHIELD:1, TOTEM_OF_UNDYING:1, or AIR)
#   items:                 Inventory slots 0-35 with format: '<MATERIAL>:<AMOUNT>'
#                          or potion objects: {type: SPLASH_POTION, potion: <POTION_TYPE>}
# =============================================================================
kits:
  # ---------------------------------------------------------------------------
  # 1. Modern Diamond Sword (Classic 1.21 Competitive Sword & Shield)
  # Modeled after Stray.gg / Minemen Club competitive Sword duels.
  # Includes Diamond Axe for disabling opponent shields.
  # ---------------------------------------------------------------------------
  modern-diamond-sword:
    description: "Diamond Sword - Full Diamond Prot IV, Sharp V Sword, Axe & Shield"
    health: 20
    natural-regeneration: true
    armor: [DIAMOND_BOOTS, DIAMOND_LEGGINGS, DIAMOND_CHESTPLATE, DIAMOND_HELMET]
    armor-enchantments: {protection: 4, unbreaking: 3}
    weapon-enchantments: {sharpness: 5, unbreaking: 3}
    bow-enchantments: {power: 5}
    offhand: 'SHIELD:1'
    items:
      0: 'DIAMOND_SWORD:1'
      1: 'DIAMOND_AXE:1'
      2: 'GOLDEN_APPLE:16'
      3: 'ENDER_PEARL:16'
      4: 'WATER_BUCKET:1'
      5: 'COBWEB:16'
      6: 'BOW:1'
      7: 'ARROW:32'
      8: 'COOKED_BEEF:32'

