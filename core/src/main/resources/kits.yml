# Reload changes in-game using: /practice reload
#
# Kit Structure:
#   description:           Display description shown in the practice menu
#   health:                Starting and maximum health points (20 = 10 hearts)
#   natural-regeneration:  Whether standard food/saturation healing is enabled
#   armor:                 [BOOTS, LEGGINGS, CHESTPLATE, HELMET]
#   armor-enchantments:    Enchantments applied to all 4 armor pieces
#   bow-enchantments:      Enchantments applied to bows & crossbows
#   offhand:               Off hand item (e.g. SHIELD, TOTEM_OF_UNDYING, or AIR)
#   items:                 Inventory slots 0-35 (0-8 hotbar, 9-35 inventory)
#                          Format: '<MATERIAL>:<AMOUNT>' or {type: <MATERIAL>, enchants: {<ENCHANT>: <LEVEL>}}
#                          or for potions: {type: SPLASH_POTION, potion: <POTION_TYPE>}
