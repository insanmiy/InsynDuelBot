name: InsynDuelBot
provides: [PracticePlugin, InsynPracticeBotMC]
version: '${version}'
main: dev.insanmiy.practiceplugin.PracticePlugin
api-version: '${minecraftVersion}'
author: insanmiy
description: PvP Duels Against A Custom Bot.
commands:
  practice:
    description: PvP Bot Practice
    aliases: [p, prac]
    usage: /practice <menu|settings|start|stop|pause|resume|rematch|hud|damage|stats|kits|difficulties|kit [editor|info|create|import|edit|save|copy|rename|delete]|status|arena|reload>
    permission: practice.use
permissions:
  practice.use:
    description: Allows opening practice menus, starting bot duels, and configuring player settings
    default: true
  practice.kits:
    description: Create and edit custom kits (up to 50) in the kit editor
    default: true
  practice.admin:
    description: Full administrative control over practice bot arenas, player matches, and plugin reload
    default: op
    children:
      practice.use: true
      practice.kits: true
